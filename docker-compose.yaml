version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: dockerfiles/Dockerfile1
    container_name: fiber-jwt-app
    image: fiber-jwt-app-1
    depends_on:
      - db
    env_file:
      - docker.env
    ports:
      - "3000:3000"
  db:
    image: postgres
    container_name: ${DB_NAME}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    restart: always